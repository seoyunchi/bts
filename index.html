const ERAS=[
{id:"rebellious-noir",name:"Rebellious Noir",archetype:"The Defiant Rebel",colorPrimary:"#000000",colorSecondary:"#B22222",colorAccent:"#8B0000",description:"Born from fire and defiance. You carry the spirit of 'No More Dream' — the courage to question the system and forge your own path against all odds.",analysisParagraphs:["Your soul resonates with the raw, unpolished energy of BTS's debut era. Like the boys who stood on that stage in 2013 with 'No More Dream,' you refuse to be boxed in by society's expectations. RM once said, 'Your dream is the map of your life,' and you've taken that literally — charting your own course even when the world told you to follow the beaten path.","The 'Rebellious Noir' archetype is marked by a fierce independence and an unshakeable belief in your own voice. You see through the illusions of the 'success criteria' that society tries to impose, much like the defiant stance in 'N.O' and 'We Are Bulletproof Pt.2.' Your strength lies in your ability to stand alone, to be the bulletproof shield for your own convictions.","Yet beneath that hardened exterior lies a vulnerability — the knowledge that rebellion is often born from pain. Suga once reflected, 'If you don't work hard, there won't be results,' and your journey has been one of relentless effort. Your challenge now is to channel that fire not just against what you oppose, but toward what you truly love."],healingTrack:{title:"We Are Bulletproof: The Eternal",artist:"BTS",youtubeUrl:"https://youtube.com/watch?v=7UWBYJQILQE"},keywords:["defiant","rebellious","fierce","independent","bulletproof"]},
{id:"ethereal-youth",name:"Ethereal Youth (HYYH)",archetype:"The Sensitive Idealist",colorPrimary:"#FF7F50",colorSecondary:"#FF6347",colorAccent:"#FFD700",description:"You live in the space between a fading sunset and the deep sea — nostalgic, dreamy, and achingly beautiful. The '花樣年華' (HYYH) era runs through your veins.",analysisParagraphs:["Your soul belongs to the 'Most Beautiful Moment in Life' — that fleeting, bittersweet chapter where youth is both a blessing and a curse. Like the narrative of 'I Need U' and 'Run,' you understand that the most beautiful moments are often the most painful. You feel things deeply, perhaps too deeply, and that sensitivity is both your greatest gift and your heaviest burden.","The 'Sensitive Idealist' archetype is defined by a longing for meaning in a world that often feels chaotic. You see beauty in the mundane — the way light hits a window, the sound of rain, the texture of an old photograph. V once said, 'It's okay to be sad. It's okay to not be okay,' and those words resonate with your core. You don't run from sadness; you sit with it, learn from it, and transform it into art.","Your journey mirrors the HYYH narrative — a search for identity in the liminal space between childhood and adulthood. Jimin's words echo here: 'I want to be a person who gives comfort to others.' You have a natural inclination to heal, to nurture, to hold space for others' pain. But remember: even the most beautiful moment in life requires you to be present for your own story too."],healingTrack:{title:"Spring Day",artist:"BTS",youtubeUrl:"https://youtube.com/watch?v=xEeFrLSkMm8"},keywords:["nostalgic","sensitive","dreamy","bittersweet","healing"]},
{id:"baroque-decadence",name:"Baroque Decadence (Wings)",archetype:"The Passionate Alchemist",colorPrimary:"#8B008B",colorSecondary:"#008080",colorAccent:"#FFD700",description:"You are a creature of transformation — part sinner, part saint. The 'Wings' era speaks to your ability to confront darkness and emerge with something beautiful.",analysisParagraphs:["Your soul carries the weight of 'Blood Sweat & Tears' — the understanding that great beauty requires great sacrifice. You are drawn to the Baroque, to the ornate, to the things that are both sacred and profane. Like the members who explored their individual shadows in the 'Wings' solos, you are not afraid to look into the abyss and find art there.","The 'Passionate Alchemist' archetype transforms pain into power. You understand that temptation is not something to be feared but to be understood. Jungkook's 'Begin' speaks to your journey — the realization that love can be both salvation and destruction. You've tasted both, and you've learned that the only way out is through.","Your path is one of integration — bringing together the light and shadow, the sacred and the sensual. As RM reflected during this era, 'Pain is a gift. Without it, we wouldn't know joy.' Your challenge is to embrace the full spectrum of your humanity, to let your wings carry you not above the world, but deeper into it."],healingTrack:{title:"Blood Sweat & Tears",artist:"BTS",youtubeUrl:"https://youtube.com/watch?v=hmE9f-TEutc"},keywords:["passionate","transformative","alchemical","shadow-work","decadent"]},
{id:"chromatic-self-love",name:"Chromatic Self-Love (Love Yourself)",archetype:"The Radiant Healer",colorPrimary:"#E6E6FA",colorSecondary:"#9370DB",colorAccent:"#FF69B4",description:"You've walked through the storm and learned to love yourself. The 'Love Yourself' era pulses through you — a holographic prism of self-discovery and acceptance.",analysisParagraphs:["Your soul has been shaped by the journey from 'Love Yourself: Her' to 'Answer' — a complete arc of falling, healing, and rising. You understand that self-love is not a destination but a practice, a daily choice to look in the mirror and say, 'You are enough.' Like the narrative of 'Euphoria' and 'Epiphany,' you've learned that the person you've been waiting for is yourself.","The 'Radiant Healer' archetype shines with a gentle, holographic light. You have the rare ability to see the beauty in others, often before they see it in themselves. Jin's 'Epiphany' captures your essence: 'I'm the one I should love in this world.' You've learned that healing radiates outward — that by loving yourself, you give others permission to do the same.","Your journey is one of integration — bringing together the fragmented pieces of your identity into a coherent, beautiful whole. As RM said during the LY era, 'There is no answer. The answer is within you.' You carry this wisdom like a lantern, illuminating the path for others while continuing to walk your own."],healingTrack:{title:"Epiphany",artist:"BTS (Jin)",youtubeUrl:"https://youtube.com/watch?v=fIkZOLsnoqY"},keywords:["healing","self-love","radiant","gentle","acceptance"]},
{id:"jungian-depth",name:"Jungian Depth (Map of the Soul)",archetype:"The Philosophical Explorer",colorPrimary:"#2F4F4F",colorSecondary:"#4682B4",colorAccent:"#C0C0C0",description:"You are a cartographer of the inner world. The 'Map of the Soul' era calls you to explore the shadow, the persona, and the ego — and to find your true self beneath it all.",analysisParagraphs:["Your soul is drawn to the depths — to the Jungian concepts that BTS so masterfully wove into their 'Map of the Soul' series. You understand that the persona is not a lie but a necessary interface with the world, and that the shadow is not an enemy but a teacher. 'Black Swan' speaks to your fear of losing your creative spark, and your determination to keep creating anyway.","The 'Philosophical Explorer' archetype is never satisfied with surface-level answers. You ask the hard questions: Who am I? What is my purpose? What am I afraid of? Like RM's intro 'Persona,' you grapple with the question, 'Who the hell am I?' — not as a crisis, but as a lifelong inquiry. Your strength is your intellectual curiosity and your willingness to sit with uncertainty.","Your journey is one of individuation — the process of becoming your true self. Suga's 'Shadow' captures your struggle: the fear of success, the weight of expectations, the desire to be both seen and hidden. But as the album teaches us, only by integrating our shadow can we become whole. Your path is not about perfection but about authenticity."],healingTrack:{title:"Black Swan",artist:"BTS",youtubeUrl:"https://youtube.com/watch?v=0lapF4DQPKQ"},keywords:["philosophical","introspective","shadow-work","authentic","depth"]},
{id:"healing-domesticity",name:"Healing Domesticity (BE)",archetype:"The Gentle Anchor",colorPrimary:"#708090",colorSecondary:"#F5F5F5",colorAccent:"#FFE4E1",description:"You are the calm in the storm, the warm light in a cold room. The 'BE' era reflects your understanding that healing is found in life's simplest, most intimate moments.",analysisParagraphs:["Your soul carries the quiet wisdom of the 'BE' era — an album born from a time of global pause and personal reflection. You understand that healing doesn't always come in grand gestures but in the small, sacred rituals of daily life. 'Life Goes On' is your anthem: a gentle reminder that even when the world stops, we find ways to keep going, together.","The 'Gentle Anchor' archetype is the friend everyone turns to in times of need. Like Jin's 'Moon' or Jungkook's 'Still With You,' you have a stabilizing presence that makes others feel safe. You find beauty in domesticity — in shared meals, in quiet conversations, in the comfort of being truly seen by someone who loves you.","Your journey has taught you that vulnerability is not weakness but the foundation of true connection. As RM said during the BE era, 'It's okay to say that you're not okay.' You've learned to hold space for your own pain and for others', creating a sanctuary of acceptance. Your gift is your ability to make the people around you feel at home."],healingTrack:{title:"Life Goes On",artist:"BTS",youtubeUrl:"https://youtube.com/watch?v=-5q5m8be1Vk"},keywords:["gentle","anchoring","healing","intimate","comforting"]},
{id:"eternal-legacy",name:"Eternal Legacy (Proof)",archetype:"The Timeless Archivist",colorPrimary:"#1A1A40",colorSecondary:"#DDA0DD",colorAccent:"#FFD700",description:"You are a keeper of stories, a weaver of legacies. The 'Proof' era resonates with your understanding that some things transcend time — love, art, and the bonds we forge.",analysisParagraphs:["Your soul understands the weight of legacy. The 'Proof' anthology is not just a collection of songs but a testament to a journey — and you see your own life the same way. Every chapter, every struggle, every triumph is part of a larger narrative that you are still writing. 'Yet To Come' is your creed: the best moments are still ahead.","The 'Timeless Archivist' archetype honors the past while looking toward the future. You understand that where you come from shapes who you become, but it doesn't define where you're going. Like the members who looked back on their decade-long journey with gratitude and anticipation, you carry your history with grace, using it as a foundation rather than a cage.","Your journey is one of integration — bringing together all the versions of yourself into a coherent whole. As the members reflected in 'Proof,' the answer to 'Who am I?' is not a single moment but an entire lifetime of becoming. Your gift is your ability to see the through-line in your own story and to inspire others to find theirs."],healingTrack:{title:"Yet To Come",artist:"BTS",youtubeUrl:"https://youtube.com/watch?v=9Hoq3X3Y6eE"},keywords:["timeless","legacy","reflective","hopeful","archival"]},
{id:"individual-together",name:"Individual & Together (Chapter 2)",archetype:"The Cosmic Weaver",colorPrimary:"#191970",colorSecondary:"#DDA0DD",colorAccent:"#FFD700",description:"You embody the paradox of being both an individual and part of something greater. 'Chapter 2' speaks to your journey of self-discovery within the constellation of community.",analysisParagraphs:["Your soul resonates with the energy of 'Chapter 2' — the era where each member explored their individual artistry while remaining connected to the whole. You understand that true freedom is not about going alone but about knowing you can stand on your own while still choosing to be part of something larger. Like the members' solo journeys, you've learned that individuality and togetherness are not opposites but complements.","The 'Cosmic Weaver' archetype moves between worlds with grace. You've explored your own path — like J-Hope's 'Jack In The Box,' RM's 'Indigo,' Agust D's 'D-DAY,' or Jungkook's 'GOLDEN' — and you've discovered that your individual voice only grows stronger when shared. You are both a star and part of a constellation, shining alone and together.","Your journey is one of expansion — not away from your roots but outward from them. As RM said of 'Indigo,' 'I wanted to show my 20s as honestly as possible.' You too are documenting your own chapter, knowing that the most authentic story is one that embraces both the individual notes and the harmony they create together."],healingTrack:{title:"Indigo (RM) / D-DAY (Agust D)",artist:"RM / Agust D",youtubeUrl:"https://youtube.com/watch?v=k3Wqj3j6vR0"},keywords:["individual","cosmic","connected","expansive","authentic"]}
];

{id:1,chapter:"Rebellion",title:"The Standard",narrative:"You stand before a chalkboard covered in society's 'Success Criteria.' What do you do?",options:[{id:"1A",text:"Smash the chalkboard — redefine success on my own terms.",weights:[{eraId:"rebellious-noir",weight:3}]},{id:"1B",text:"Capture the moment on film — this struggle is part of my youth.",weights:[{eraId:"ethereal-youth",weight:3}]},{id:"1C",text:"Erase the criteria and write: 'Love yourself.'",weights:[{eraId:"chromatic-self-love",weight:3}]},{id:"1D",text:"Take a photo and keep it as proof of how far I've come.",weights:[{eraId:"eternal-legacy",weight:3}]}]},
{id:2,chapter:"Rebellion",title:"The Hideout Item",narrative:"You find a hidden box in your childhood hideout. Inside is one item that defined your youth. Which is it?",options:[{id:"2A",text:"A worn lyrics book — pages filled with songs I wrote in the dark.",weights:[{eraId:"rebellious-noir",weight:2},{eraId:"healing-domesticity",weight:1}]},{id:"2B",text:"A film roll of undeveloped memories — moments I was too afraid to face.",weights:[{eraId:"ethereal-youth",weight:2},{eraId:"baroque-decadence",weight:1}]},{id:"2C",text:"An iron box of letters — words I never had the courage to send.",weights:[{eraId:"chromatic-self-love",weight:2},{eraId:"healing-domesticity",weight:1}]},{id:"2D",text:"A one-way ticket to a city I've never been — the future waiting.",weights:[{eraId:"jungian-depth",weight:2},{eraId:"individual-together",weight:1}]}]},

{id:6,chapter:"Love Yourself / MOTS",title:"The Mask",narrative:"You hold a beautiful mask in your hands. It's exquisite — almost perfect. What does it mean to you?",options:[{id:"6A",text:"It's suffocating — I need to tear it off and breathe.",weights:[{eraId:"rebellious-noir",weight:1},{eraId:"jungian-depth",weight:2}]},{id:"6B",text:"It preserves my beauty — but I'm tired of hiding the cracks.",weights:[{eraId:"baroque-decadence",weight:2},{eraId:"chromatic-self-love",weight:1}]},{id:"6C",text:"I've had an epiphany — the mask is not who I am.",weights:[{eraId:"chromatic-self-love",weight:3}]},{id:"6D",text:"The mask is my persona — a necessary part of who I show the world.",weights:[{eraId:"jungian-depth",weight:3}]}]},
{id:7,chapter:"Love Yourself / MOTS",title:"The Hourglass",narrative:"Time is slipping through an hourglass. You have the power to pause it. Where do you freeze the moment?",options:[{id:"7A",text:"In the middle of a storm — chaos is where I feel most alive.",weights:[{eraId:"rebellious-noir",weight:1},{eraId:"baroque-decadence",weight:2}]},{id:"7B",text:"At a strawberry farm — simple, sweet, and full of warmth.",weights:[{eraId:"healing-domesticity",weight:3}]},{id:"7C",text:"In a practice room — sweat, mirrors, and the pursuit of perfection.",weights:[{eraId:"jungian-depth",weight:2},{eraId:"eternal-legacy",weight:1}]},{id:"7D",text:"At a train station — the moment of reunion after a long separation.",weights:[{eraId:"eternal-legacy",weight:2},{eraId:"individual-together",weight:1}]}]},
{id:8,chapter:"Love Yourself / MOTS",title:"The Shadow",narrative:"Your shadow detaches from your feet and stands before you, alive. It speaks. What do you do?",options:[{id:"8A",text:"Dismiss it — I don't have time for my own darkness.",weights:[{eraId:"rebellious-noir",weight:1},{eraId:"jungian-depth",weight:2}]},{id:"8B",text:"Hold it tight — even my shadow deserves love.",weights:[{eraId:"chromatic-self-love",weight:2},{eraId:"healing-domesticity",weight:1}]},{id:"8C",text:"Embrace it and dance — light and shadow moving as one.",weights:[{eraId:"baroque-decadence",weight:2},{eraId:"jungian-depth",weight:1}]},{id:"8D",text:"Let it grow independently — my shadow has its own journey.",weights:[{eraId:"individual-together",weight:3}]}]},
{id:9,chapter:"BE / Healing",title:"The Blue Room",narrative:"You enter a room bathed in blue light. The walls are covered in memories. What do you add to the room?",options:[{id:"9A",text:"Rebel graffiti — a declaration that I survived this far.",weights:[{eraId:"rebellious-noir",weight:2},{eraId:"eternal-legacy",weight:1}]},{id:"9B",text:"A photo album — pages of moments that shaped who I am.",weights:[{eraId:"ethereal-youth",weight:2},{eraId:"healing-domesticity",weight:1}]},{id:"9C",text:"A dance solo — movement as the truest language of the soul.",weights:[{eraId:"baroque-decadence",weight:1},{eraId:"individual-together",weight:2}]},{id:"9D",text:"A map of my inner world — every scar, every joy, every question mapped.",weights:[{eraId:"jungian-depth",weight:2},{eraId:"chromatic-self-love",weight:1}]}]},
{id:10,chapter:"BE / Healing",title:"The Window",narrative:"You look out a rain-streaked window. What do you see on the other side?",options:[{id:"10A",text:"Rain falling on empty streets — the beauty of melancholy.",weights:[{eraId:"ethereal-youth",weight:2},{eraId:"healing-domesticity",weight:1}]},{id:"10B",text:"The sea and the hideout — a place where I was truly free.",weights:[{eraId:"ethereal-youth",weight:1},{eraId:"healing-domesticity",weight:2}]},{id:"10C",text:"A field of Smeraldo flowers — a secret message meant for me.",weights:[{eraId:"chromatic-self-love",weight:2},{eraId:"eternal-legacy",weight:1}]},{id:"10D",text:"A blue bus heading to the future — and I'm ready to board.",weights:[{eraId:"individual-together",weight:3}]}]},
{id:11,chapter:"Proof / Future",title:"The Telescope",narrative:"You look through a telescope and see not the stars, but versions of yourself across time. Which one do you focus on?",options:[{id:"11A",text:"My past self — the one who dreamed before knowing the cost.",weights:[{eraId:"ethereal-youth",weight:1},{eraId:"eternal-legacy",weight:2}]},{id:"11B",text:"The HYYH boy — young, scared, but full of beautiful moments.",weights:[{eraId:"ethereal-youth",weight:2},{eraId:"healing-domesticity",weight:1}]},{id:"11C",text:"The artist shadow — the version of me that creates from pain.",weights:[{eraId:"baroque-decadence",weight:1},{eraId:"jungian-depth",weight:2}]},{id:"11D",text:"The indigo galaxy — the vast, expansive self I'm becoming.",weights:[{eraId:"individual-together",weight:3}]}]},

// ===== PARTICLE CANVAS =====
function ParticleCanvas({trigger,mouseX,mouseY,phaseColor}){
  const ref=useRef(null);
  const particles=useRef([]);
  const idRef=useRef(0);
  useEffect(()=>{
    const c=ref.current; if(!c)return;
    const ctx=c.getContext('2d'); if(!ctx)return;
    const resize=()=>{c.width=window.innerWidth;c.height=window.innerHeight};
    resize(); window.addEventListener('resize',resize);
    const colors=['#8B5CF6','#DDA0DD','#FF69B4','#E6E6FA','#FFD700','#9370DB'];
    function burst(x,y){
      for(let i=0;i<10;i++){
        const a=Math.PI*2*i/10+Math.random()*0.5;
        const v=2+Math.random()*4;
        particles.current.push({id:idRef.current++,x,y,color:colors[Math.floor(Math.random()*colors.length)],size:3+Math.random()*5,angle:a,velocity:v,rotation:Math.random()*360,type:Math.random()>0.5?'ribbon':'ember'});
      }

        !transition?
        React.createElement(motion.div,{key:question.id,className:'w-full max-w-3xl mx-auto',initial:{opacity:0,y:30,filter:'blur(10px)'},animate:{opacity:1,y:0,filter:'blur(0px)'},exit:{opacity:0,y:-30,filter:'blur(10px)'},transition:{duration:0.6,ease:[0.22,1,0.36,1]}},
          React.createElement(motion.h2,{className:'text-2xl sm:text-3xl md:text-4xl font-bold text-white mb-3 tracking-tight',initial:{opacity:0,y:20},animate:{opacity:1,y:0},transition:{delay:0.1,duration:0.5}},question.title),
